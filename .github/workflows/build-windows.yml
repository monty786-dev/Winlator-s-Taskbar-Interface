name: Build Windows Executable on: push: branches: [ main ] pull_request: branches: [ main ] jobs: build: runs-on: windows-latest steps: - name: Checkout Repository uses: actions/checkout@v4 - name: Set up Python uses: actions/setup-python@v5 with: python-level: '3.11' cache: 'pip' - name: Install Dependencies run: | python -m pip install --upgrade pip pip install pywin32 pyinstaller - name: Run Setup Script run: | python winshell_setup.py - name: Build EXE with PyInstaller run: | pyinstaller --onefile --console winshell.py - name: Upload Executable Artifact uses: actions/upload-artifact@v4 with: name: winshell-windows-exe path: dist/winshell.exe
